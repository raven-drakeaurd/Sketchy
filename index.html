<title>Sketchy</title>
<style>
/* Layout: desktop-app shell — title strip, menu bar, tool strip, full-bleed 3D viewport with a docked tray on the right, status bar with Measurements box. */
:root{
  --chrome:#ECEEF1; --chrome-2:#DFE3E8; --panel:#F7F8FA; --line:#C3C9D1; --line-soft:#D9DDE3;
  --fg:#1C2128; --muted:#5A6470; --accent:#2B63C6; --accent-soft:#D5E3F7; --hover:#E2EBF7;
  --field:#FFFFFF; --icon-bg:transparent; --title:#2B3440; --title-fg:#F1F4F8; --tip:#FFFBE0; --tip-fg:#222; --danger:#B3261E;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#2A2E34; --chrome-2:#23272C; --panel:#30353C; --line:#4A515B; --line-soft:#3B414A;
  --fg:#E6E9EE; --muted:#A2ABB7; --accent:#6EA1F2; --accent-soft:#2E405C; --hover:#3A4656;
  --field:#1D2025; --icon-bg:#CDD3DB; --title:#16191D; --title-fg:#E6E9EE; --tip:#3B3826; --tip-fg:#F3EFD0; --danger:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#2A2E34; --chrome-2:#23272C; --panel:#30353C; --line:#4A515B; --line-soft:#3B414A;
  --fg:#E6E9EE; --muted:#A2ABB7; --accent:#6EA1F2; --accent-soft:#2E405C; --hover:#3A4656;
  --field:#1D2025; --icon-bg:#CDD3DB; --title:#16191D; --title-fg:#E6E9EE; --tip:#3B3826; --tip-fg:#F3EFD0; --danger:#F08A80; color-scheme:dark}
html,body{height:100%}
body{background:var(--chrome);color:var(--fg);font:13px/1.35 var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#titlebar{display:flex;align-items:center;gap:8px;height:28px;background:var(--title);color:var(--title-fg);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-size:12px;flex:none}
#titlebar .logo{width:16px;height:16px;flex:none}
#titlebar .ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titlebar .theme{background:none;border:1px solid transparent;color:inherit;font:inherit;border-radius:3px;padding:1px 6px;cursor:pointer;opacity:.8}
#titlebar .theme:hover{border-color:currentColor;opacity:1}
#menubar{display:flex;background:var(--chrome);border-bottom:1px solid var(--line-soft);padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));flex:none;position:relative;z-index:30;overflow-x:auto;scrollbar-width:none}
#menubar>.mi{padding:4px 9px;cursor:default;border:1px solid transparent;white-space:nowrap}
#menubar>.mi:hover,#menubar>.mi.open{background:var(--hover);border-color:var(--accent-soft)}
.dropdown{position:fixed;background:var(--panel);border:1px solid var(--line);box-shadow:2px 3px 10px rgba(0,0,0,.18);padding:3px 0;min-width:230px;z-index:100;max-height:80vh;overflow:auto}
.dropdown .it{display:flex;gap:16px;align-items:center;padding:4px 22px 4px 26px;cursor:default;position:relative;white-space:nowrap}
.dropdown .it:hover{background:var(--hover)}
.dropdown .it.dis{color:var(--muted);opacity:.6}
.dropdown .it .k{margin-left:auto;color:var(--muted);font-size:12px}
.dropdown .it.chk::before{content:"\2713";position:absolute;left:9px}
.dropdown .sep{height:1px;background:var(--line-soft);margin:3px 2px}
.dropdown .hd{padding:4px 12px 2px;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
#toolbar{display:flex;align-items:center;gap:1px;background:var(--chrome-2);border-bottom:1px solid var(--line);padding:3px max(16px,env(safe-area-inset-right,0px)) 3px max(16px,env(safe-area-inset-left,0px));flex:none;overflow-x:auto;scrollbar-width:thin}
.tb{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid transparent;border-radius:3px;background:none;padding:0;cursor:pointer;color:var(--fg)}
.tb svg{width:24px;height:24px;background:var(--icon-bg);border-radius:3px}
.tb:hover{background:var(--hover);border-color:var(--accent-soft)}
.tb.on{background:var(--accent-soft);border-color:var(--accent)}
.tb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tsep{width:1px;height:26px;background:var(--line);margin:0 5px;flex:none}
.grip{width:5px;height:24px;flex:none;margin-right:3px;background:radial-gradient(circle,var(--line) 1px,transparent 1.4px) 0 0/5px 4px}
#main{flex:1;display:flex;min-height:0;position:relative}
#viewport{flex:1;position:relative;overflow:hidden;min-width:0;touch-action:none;background:#dfe9f3}
#viewport canvas{position:absolute;inset:0;display:block}
#overlay{pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--tip);color:var(--tip-fg);border:1px solid rgba(0,0,0,.35);font-size:11px;padding:1px 5px;white-space:nowrap;display:none;z-index:5}
#ctxbar{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.88);color:#222;border:1px solid #9aa4b0;padding:3px 8px;font-size:12px;display:none;gap:8px;align-items:center;z-index:4}
#ctxbar button{font:inherit;padding:1px 8px;cursor:pointer}
#tray{width:268px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tray .trayhead{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 10px;background:var(--chrome-2);border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
#tray .trayhead button{border:none;background:none;color:var(--fg);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
#trayscroll{overflow:auto;flex:1;min-height:0}
.pnl{border-bottom:1px solid var(--line-soft)}
.pnl>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12px;background:var(--chrome)}
.pnl>summary::-webkit-details-marker{display:none}
.pnl>summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid var(--muted);margin-left:1px;transition:transform .12s}
.pnl[open]>summary::before{transform:rotate(90deg) translate(1px,2px)}
.pnl>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row label,.lbl{color:var(--muted);min-width:64px;font-size:12px}
.row .val{font-variant-numeric:tabular-nums}
input[type=text],select,textarea{font:inherit;background:var(--field);color:var(--fg);border:1px solid var(--line);border-radius:2px;padding:2px 5px;min-width:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sw{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer;background-size:cover;padding:0;max-width:100%}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw:focus-visible{outline:2px solid var(--accent)}
.curmat{display:flex;gap:8px;align-items:center}
.curmat .big{width:44px;height:44px;border:1px solid var(--line);background-size:cover;flex:none}
.curmat .nm{font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:4px}
.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--chrome);color:var(--fg);padding:3px 10px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary:disabled{background:var(--accent)}
.note{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note.warn{color:var(--danger)}
.stylebtns{display:flex;flex-wrap:wrap;gap:2px}
.instr h4{margin:0;font-size:13px}
.instr ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.instr .mods{font-size:12px;color:var(--muted)}
.instr .ico{width:40px;height:40px;flex:none;border:1px solid var(--line-soft);display:grid;place-items:center;background:#FFFFFF}
.instr .ico svg{width:30px;height:30px}
#statusbar{display:flex;align-items:center;gap:10px;height:28px;background:var(--chrome);border-top:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));flex:none;font-size:12px}
#statusbar .sicons{display:flex;gap:4px;color:var(--muted)}
#statusbar .sicons svg{width:16px;height:16px}
#hint{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#vcbwrap{display:flex;align-items:center;gap:6px;flex:none}
#vcblabel{color:var(--muted)}
#vcb{width:150px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.35);display:grid;place-items:center;z-index:200;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.3);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.dlg .dh{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--chrome-2);border-bottom:1px solid var(--line);font-weight:600}
.dlg .dh button{border:none;background:none;color:var(--fg);font-size:18px;cursor:pointer;line-height:1}
.dlg .db{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:10px 14px;border-top:1px solid var(--line-soft)}
.welcome .hero{display:flex;gap:14px;align-items:center}
.welcome .hero svg{width:56px;height:56px;flex:none}
.welcome h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.tpl{display:flex;flex-direction:column;gap:4px}
.tpl button{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);background:var(--field);color:var(--fg);padding:8px 10px;cursor:pointer;border-radius:2px}
.tpl button:hover{border-color:var(--accent)}
.tpl button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tpl button b{display:block;font-weight:600}
.tpl button span{color:var(--muted);font-size:12px}
.tpl .th{width:52px;height:38px;flex:none;border:1px solid var(--line-soft);background:linear-gradient(#a9c7e6,#eef4fa 60%,#fff 60%)}
table.keys{border-collapse:collapse;width:100%;font-size:12px}
table.keys td{padding:3px 6px;border-bottom:1px solid var(--line-soft)}
table.keys td:last-child{font-family:var(--mono);text-align:right;white-space:nowrap}
#ctxmenu{position:fixed;z-index:120}
@media (max-width:760px){
  #tray{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-4px 0 14px rgba(0,0,0,.2);max-width:88%}
  #vcb{width:110px}
}
@media (max-width:480px){ #statusbar .sicons{display:none} #titlebar .theme{display:none} }
@media (prefers-reduced-motion:reduce){ .pnl>summary::before{transition:none} }
</style>

<script>
(function(){
'use strict';
const STANDALONE=false; /* set to true by build.mjs for the desktop / offline build */
const NATIVE=window.swNative||null;
let filePath=null;
const T=THREE, PC=window.polygonClipping;
const X=new T.Vector3(1,0,0), Y=new T.Vector3(0,1,0), Z=new T.Vector3(0,0,1);

const vk=p=>Math.round(p.x*500)+','+Math.round(p.y*500)+','+Math.round(p.z*500);

const AXES=[{v:X,name:'Red',col:'#E0281E'},{v:Y,name:'Green',col:'#1E9B2E'},{v:Z,name:'Blue',col:'#1F4FE0'}];

/* ================= Units ================= */
let units='arch';
const UNIT_NAMES={arch:'Architectural (feet and inches)',m:'Decimal (meters)',mm:'Decimal (millimeters)'};
const PREC_DEFAULT={arch:8,m:3,mm:1};
let precision={...PREC_DEFAULT};
const PREC_CHOICES={
  arch:[1,2,4,8,16,32,64].map(d=>[d,d===1?'0"  (whole inches)':`0 1/${d}"`]),
  m:[0,1,2,3,4,5,6].map(d=>[d,(0).toFixed(d)+'m']),
  mm:[0,1,2,3,4,5,6].map(d=>[d,(0).toFixed(d)+'mm'])};
function setPrecision(p){precision={...PREC_DEFAULT,...(p||{})};}
function fmtDec(inch,perInch,suffix,d){const neg=inch<0,a=Math.abs(inch),str=(a*perInch).toFixed(d);
  const approx=Math.abs(parseFloat(str)/perInch-a)>2e-5;return (approx?'~ ':'')+(neg&&parseFloat(str)!==0?'-':'')+str+suffix;}
function fmtLen(inch){
  if(units==='m') return fmtDec(inch,0.0254,'m',precision.m);
  if(units==='mm') return fmtDec(inch,25.4,'mm',precision.mm);
  const neg=inch<0,a=Math.abs(inch),D=precision.arch;
  const e=Math.round(a*D), ft=Math.floor(e/(12*D)), rem=e-ft*12*D, inc=Math.floor(rem/D); let fr=rem-inc*D, fs='';
  if(fr){let n=fr,d=D;while(n%2===0){n/=2;d/=2;}fs=n+'/'+d;}
  let str; if(ft) str=`${ft}' ${inc}${fs?' '+fs:''}"`; else str=inc?`${inc}${fs?' '+fs:''}"`:(fs?fs+'"':'0"');
  return (Math.abs(a-e/D)>1e-3?'~ ':'')+(neg&&e?'-':'')+str;

function fmtArea(sq){
  if(units==='m') return (sq*0.00064516).toFixed(precision.m)+' Meters²';
  if(units==='mm') return (sq*645.16).toFixed(precision.mm)+' Millimeters²';
  return (sq/144).toFixed(2)+' Feet²';

function parseLen(s){
  s=String(s).trim().toLowerCase(); if(!s) return null;
  let m=s.match(/^(-?[\d.]+)\s*(mm|cm|m|in|ft)$/);

  let neg=false; if(s[0]==='-'){neg=true;s=s.slice(1);}
  if(units!=='arch' && !/['"]/.test(s)){const v=parseFloat(s);if(isNaN(v))return null;return (neg?-1:1)*v*(units==='m'?1/0.0254:1/25.4);}
  let ft=0,inch=0; const fi=s.indexOf("'");
  if(fi>=0){ft=parseFloat(s.slice(0,fi)); if(isNaN(ft)) return null; s=s.slice(fi+1);}
  s=s.replace(/"/g,'').replace(/-/g,' ').trim();
  if(s){for(const p of s.split(/\s+/)){if(p.includes('/')){const [a,b]=p.split('/').map(Number);if(!b||isNaN(a))return null;inch+=a/b;}else{const v=parseFloat(p);if(isNaN(v))return null;inch+=v;}}}
  return (neg?-1:1)*(ft*12+inch);
}

/* ================= Geometry helpers ================= */
function newell(pts){const n=v3();for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];n.x+=(a.y-b.y)*(a.z+b.z);n.y+=(a.z-b.z)*(a.x+b.x);n.z+=(a.x-b.x)*(a.y+b.y);}return n;}
const fNormal=f=>newell(f.loops[0]).normalize();
function basisOf(n){let u;if(Math.abs(n.z)>0.9995)u=v3(1,0,0);else u=v3(0,0,1).cross(n).normalize();const v=n.clone().cross(u).normalize();return{u,v};}
function frameOf(n,p){const b=basisOf(n);return{n:n.clone(),u:b.u,v:b.v,o:n.clone().multiplyScalar(n.dot(p))};}
const to2=(fr,p)=>{const d=p.clone().sub(fr.o);return[d.dot(fr.u),d.dot(fr.v)];};
const to3=(fr,q)=>fr.o.clone().addScaledVector(fr.u,q[0]).addScaledVector(fr.v,q[1]);

const faceById=id=>M.faces.find(f=>f.id===id);

function polyToFaces(mp,fr,flip,props){

const loopsTo2=(loops,fr)=>loops.map(l=>l.map(p=>to2(fr,p)));

  const ids=new Set(M.faces.map(f=>f.id));for(const id of[...sel.faces])if(!ids.has(id))sel.faces.delete(id);
  for(const k of[...sel.edges])if(!EDGEMAP.has(k))sel.edges.delete(k);

function collectVerts(s){

  for(const k of s.edges){const e=EDGEMAP.get(k);if(e){v.add(gk(e.gid,e.a));v.add(gk(e.gid,e.b));}}

function entToSel(ent,s){if(!ent)return;if(ent.kind==='face')s.faces.add(ent.id);else if(ent.kind==='edge')s.edges.add(ent.k);else if(ent.kind==='group')s.groups.add(ent.gid);else if(ent.kind==='guide')s.guides.add(ent.id);else if(ent.kind==='person')s.person=true;}

  while(changed){changed=false;
    for(const f of M.faces){if(f.gid!==gid||f.hidden||fs.has(f.id))continue;if(f.loops.some(L=>L.some(p=>vset.has(vk(p))))){fs.add(f.id);addF(f);changed=true;}}
    for(const e of EDGES){if(e.gid!==gid||es.has(e.k))continue;if(vset.has(vk(e.a))||vset.has(vk(e.b))){es.add(e.k);vset.add(vk(e.a));vset.add(vk(e.b));changed=true;}}}

function clickSelect(ent,detail,mods){
  if(!ent){if(!mods.shift&&!mods.ctrl){if(ctx!=null&&detail<2){closeGroup();return;}clearSel();}rebuildScene();updateInfo();return;}
  if(detail>=3&&(ent.kind==='face'||ent.kind==='edge')){const c=connectedFrom(ent.kind==='face'?[ent.id]:[],ent.kind==='edge'?[ent.k]:[],ent.gid);clearSel();c.fs.forEach(id=>sel.faces.add(id));c.es.forEach(k=>sel.edges.add(k));}
  else if(detail===2){
    if(ent.kind==='group'){ctx=ent.gid;clearSel();updateCtxBar();}
    else if(ent.kind==='face'){const f=faceById(ent.id);clearSel();sel.faces.add(f.id);f.loops.forEach(L=>L.forEach((p,i)=>{const k=ek(p,L[(i+1)%L.length],f.gid);if(EDGEMAP.has(k))sel.edges.add(k);}));}

}
function boxSelect(b,mods){

  const inside=p=>{const s=scr(p);return s&&s.x>=x0&&s.x<=x1&&s.y>=y0&&s.y<=y1;};
  const segHits=(a,c)=>{const s=seg2(a,c);if(!s)return false;if(inside(a)||inside(c))return true;const r=[[x0,y0,x1,y0],[x1,y0,x1,y1],[x1,y1,x0,y1],[x0,y1,x0,y0]];return r.some(q=>segX(s[0].x,s[0].y,s[1].x,s[1].y,...q));};

  const grpAll={},grpAny={};

    if(f.gid!==ctx){if(ctx==null&&f.gid!=null){grpAll[f.gid]=(grpAll[f.gid]??true)&&all;grpAny[f.gid]=grpAny[f.gid]||any||all;}continue;}
    if(all||any)ns.faces.add(f.id);}
  for(const e of EDGES){const all=inside(e.a)&&inside(e.b),any=crossing&&segHits(e.a,e.b);
    if(e.gid!==ctx){if(ctx==null&&e.gid!=null){grpAll[e.gid]=(grpAll[e.gid]??true)&&all;grpAny[e.gid]=grpAny[e.gid]||any||all;}continue;}
    if(all||any)ns.edges.add(e.k);}

  for(const id of sel.faces){const f=faceById(id);if(f)removeFace(f,true);}

function selectAll(){clearSel();if(ctx!=null){M.faces.forEach(f=>{if(f.gid===ctx)sel.faces.add(f.id);});EDGES.forEach(e=>{if(e.gid===ctx)sel.edges.add(e.k);});}
  else{M.faces.forEach(f=>{if(f.gid==null&&!f.hidden)sel.faces.add(f.id);else if(f.gid!=null)sel.groups.add(f.gid);});EDGES.forEach(e=>{if(e.gid==null)sel.edges.add(e.k);else sel.groups.add(e.gid);});M.guides.forEach(g=>sel.guides.add(g.id));sel.person=!!M.person.show;}

  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    parts.push(new Uint8Array(h.buffer),name,data);cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;}
  const cenSize=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cenSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}

const STL_IN_UNITS={mm:['Millimeters',1/25.4],cm:['Centimeters',1/2.54],m:['Meters',1/0.0254],in:['Inches',1],ft:['Feet',12]};
function parseSTLBuffer(buf){
  const dv=new DataView(buf),len=buf.byteLength;
  const bin=n=>{const out=new Float32Array(n*9);for(let i=0;i<n;i++){const o=84+50*i+12;for(let k=0;k<9;k++)out[i*9+k]=dv.getFloat32(o+4*k,true);}return out;};

    const text=new TextDecoder().decode(buf);const re=/vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;const v=[];let m;
    while((m=re.exec(text)))v.push(+m[1],+m[2],+m[3]);

}
function triBounds(t){const mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];for(let i=0;i<t.length;i++){const k=i%3;if(t[i]<mn[k])mn[k]=t[i];if(t[i]>mx[k])mx[k]=t[i];}return{mn,mx};}
function importMesh(tris,scale,o){

function traceRegion(ts,P,n){

function buildCabin(){
  M=newModel();M.person={show:true,x:-46,y:-34};
  const w=240,d=168,h=108;
  const [base]=addFace([[v3(0,0,0),v3(w,0,0),v3(w,d,0),v3(0,d,0)]]);
  pushPull(base,-h);
  addEdge(v3(0,d/2,h),v3(w,d/2,h),null);
  const vset=new Set([gk(null,v3(0,d/2,h)),gk(null,v3(w,d/2,h))]);applyTransform(vset,p=>p.add(v3(0,0,66)));fixNonPlanar();
  const front=()=>M.faces.find(f=>{const n=fNormal(f);return n.y<-0.99&&Math.abs(f.loops[0][0].y)<1e-3&&faceArea(f)>2000;});
  const rectY0=(x0,z0,x1,z1)=>[v3(x0,0,z0),v3(x1,0,z0),v3(x1,0,z1),v3(x0,0,z1)];
  const door=addFace([rectY0(102,0,138,80)]).find(f=>{const b=new T.Box3().setFromPoints(f.loops[0]);return b.min.x>=101.9&&b.max.x<=138.1&&b.max.z<=80.1;});
  if(door){pushPull(door,-4);door.mat='t9';}
  for(const x0 of[30,174]){const win=addFace([rectY0(x0,36,x0+36,72)]).find(f=>{const b=new T.Box3().setFromPoints(f.loops[0]);return b.min.x>=x0-.1&&b.max.x<=x0+36.1&&b.min.z>=35.9;});if(win){pushPull(win,-3);win.mat='g2';}}
  const sideWin=(x)=>{const sgn=x===0?-1:1;const pts=[v3(x,60,36),v3(x,108,36),v3(x,108,72),v3(x,60,72)];const f=addFace([pts]).find(f=>{const b=new T.Box3().setFromPoints(f.loops[0]);return b.min.y>=59.9&&b.max.y<=108.1&&b.min.z>=35.9;});if(f){pushPull(f,-3);f.mat='g2';}};
  sideWin(0);sideWin(w);
  for(const f of M.faces){const n=fNormal(f);const b=new T.Box3().setFromPoints(f.loops[0]);
    if(n.z>0.3&&b.min.z>=h-0.1)f.mat='t5';
    else if(Math.abs(n.z)<0.01&&f.mat==null&&b.min.z>=-0.01&&b.max.z>4)f.mat='t3';}
  // porch slab
  const [slab]=addFace([[v3(84,-60,0),v3(156,-60,0),v3(156,0,0),v3(84,0,0)]]);
  if(slab){pushPull(slab,-4);M.faces.forEach(f=>{const b=new T.Box3().setFromPoints(f.loops[0]);if(b.min.y>=-60.1&&b.max.y<=0.1&&b.max.z<=4.1&&b.min.x>=83.9&&b.max.x<=156.1)f.mat='t15';});}
  cleanupLines();
}

function renderItems(dd,items){
  dd.innerHTML='';for(const it of items){if(it==='-'){dd.insertAdjacentHTML('beforeend','<div class="sep"></div>');continue;}if(typeof it==='string'&&it[0]==='#'){dd.insertAdjacentHTML('beforeend',`<div class="hd">${it.slice(1)}</div>`);continue;}
    const [label,key,fn,chk,en]=it;const el=document.createElement('div');el.className='it';const lab=typeof label==='function'?label():label;const enabled=en?en():true;
    if(chk&&chk())el.classList.add('chk');if(!enabled)el.classList.add('dis');el.innerHTML=`<span>${esc(lab)}</span>${key?`<span class="k">${key}</span>`:''}`;el.tabIndex=-1;
    el.addEventListener('mouseup',e=>{e.stopPropagation();if(!enabled)return;closeMenus();fn();});dd.appendChild(el);}
}

function setParallel(v){if(v===parallel)return;const dist=view.pos.distanceTo(view.target);if(v)view.orthoH=dist*Math.tan(persp.fov*Math.PI/360);else{const d=view.orthoH/Math.tan(persp.fov*Math.PI/360);const dir=view.target.clone().sub(view.pos).normalize();view.pos.copy(view.target).addScaledVector(dir,-d);}parallel=v;}

function showWelcome(){let auto=null;try{auto=JSON.parse(storeGet('sw17-autosave')||'null');}catch(e){}const hasAuto=auto&&auto.model&&JSON.parse(auto.model).faces.length>0;
  let choice=hasAuto?'resume':'arch';
  const opts=[...(hasAuto?[['resume','Continue last model',`"${esc(auto.name||'Untitled')}", restored from this browser`]]:[]),['arch','Simple Template – Feet and Inches','Architectural units, sky gradient, scale figure'],['m','Simple Template – Meters','Decimal meters'],['mm','Simple Template – Millimeters','Decimal millimeters'],['cabin','Sample: Cabin','A gable-roof cabin built with Push/Pull, Move and Offset']];
  const d=dialog('Welcome to Sketchy',`<div class="welcome"><div class="hero">${svg('<path d="M12 2l9 5v10l-9 5-9-5V7z" fill="#D8442E"/><path d="M12 2l9 5-9 5-9-5z" fill="#F07A4F"/><path d="M12 12v10l9-5V7z" fill="#A9301F"/>',56)}<div><h2>Welcome to Sketchy</h2><p>Choose a template to start modeling. Draw a rectangle (R), then Push/Pull (P) it into a box.</p></div></div></div>
    <div class="tpl" id="tpl">${opts.map(([k,a,b])=>`<button data-k="${k}" class="${k===choice?'on':''}"><span class="th" aria-hidden="true"></span><span><b>${a}</b><span>${b}</span></span></button>`).join('')}</div>`,[['Start using Sketchy',()=>{startWith(choice,auto);},true]],'welcome');
  d.querySelectorAll('#tpl button').forEach(b=>{b.onclick=()=>{choice=b.dataset.k;d.querySelectorAll('#tpl button').forEach(x=>x.classList.toggle('on',x===b));};b.ondblclick=()=>{choice=b.dataset.k;startWith(choice,auto);closeDialog();};});}
function startWith(k,auto){setPrecision(k==='resume'&&auto?auto.precision:null);if(k==='resume'&&auto){units=auto.units||'arch';loadModelString(auto.model,auto.name);dirty=true;updateTitle();return;}if(k==='cabin'){units='arch';loadSample();return;}units=k;fileNew();}

/* --- Theme --- */
if(NATIVE)$('titlebar').hidden=true;
if(STANDALONE){MENUS[0][1]=MENUS[0][1].map(it=>Array.isArray(it)&&it[0]==='Export Model (JSON)\u2026'?['Export Model (.skw)\u2026','',exportJSON]:it);}

(function(){let t=null;try{t=localStorage.getItem('sw17-theme');}catch(e){}if(t)document.documentElement.dataset.theme=t;
  $('themebtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nt=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nt;try{localStorage.setItem('sw17-theme',nt);}catch(e){}};})();

/* ================= Main loop ================= */
function frame(){
  requestAnimationFrame(frame);stepAnim();updateCamera();
  const dist=view.pos.distanceTo(view.target);sky.position.copy(camera.position);const sr=parallel?Math.max(1e4,dist*30):camera.far*0.8;sky.scale.setScalar(sr);
  if(parallel){sky.position.copy(view.target).addScaledVector(view.target.clone().sub(view.pos).normalize(),-1);}
  personMesh.rotation.z=Math.atan2(camera.position.x-personMesh.position.x,-(camera.position.y-personMesh.position.y));
  const ds=(parallel?view.orthoH:dist)*0.012;scene.traverse(o=>{if(o.userData.dash&&o.material){o.material.dashSize=ds;o.material.gapSize=ds;}});
  renderer.render(scene,camera);drawOverlay();
}
resize();
setTool('select');setFaceStyle('tex');syncStyleUI();
refresh();
requestAnimationFrame(frame);
window.__sw={get INF(){return INF;},get camera(){return camera;},equalLength,lassoSelect,nearestGeom,fmtLen:x=>fmtLen(x),fmtArea:x=>fmtArea(x),parseLen:x=>parseLen(x),setUnits:(u,p)=>{units=u;if(p)setPrecision(p);},buildSTL,importMesh,scr:p=>scr(p),get sel(){return sel;},get EDGES(){return EDGES;},get M(){return M;},tools,setTool,pushPull,addFace,addEdge,refresh,faceById,fNormal,buildCabin,loadSample,getPick,view,undo,redo,ser};
getDownloads();
// Drag and drop: STL opens the import dialog, .skw/.json opens the model
['dragover','drop'].forEach(t=>document.addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();}));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;
  if(/\.stl$/i.test(f.name)){closeDialog();importSTLDialog(f);}
  else if(/\.(skw|json)$/i.test(f.name)){f.text().then(t=>{try{closeDialog();loadModelString(parseModelFile(t),f.name.replace(/\.(skw|json)$/i,''));filePath=null;}catch(err){toast('That file is not a Sketchy model.');}});}});
showWelcome();
if(NATIVE&&NATIVE.initialFile)NATIVE.initialFile().then(r=>{if(!r)return;closeDialog();try{loadModelString(parseModelFile(r.data),r.name.replace(/\.(skw|json)$/i,''));filePath=r.path;}catch(e){toast('That file is not a Sketchy model.');}});
})();
</script>
